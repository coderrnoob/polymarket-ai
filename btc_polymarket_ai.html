<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>BTC 5M AI Predictor</title>

<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial;
    text-align: center;
}

.container { margin-top: 40px; }

.card {
    background: #1e293b;
    padding: 20px;
    margin: 15px auto;
    width: 330px;
    border-radius: 10px;
}

.green { color: #22c55e; }
.red { color: #ef4444; }
.yellow { color: #facc15; }

button {
    padding: 10px 20px;
    background: #3b82f6;
    border: none;
    color: white;
    border-radius: 6px;
}
</style>
</head>

<body>

<div class="container">
    <h1>🚀 BTC 5M Polymarket AI</h1>

    <div class="card">
        <h2>📊 Probability Price</h2>
        <p id="price">-</p>
    </div>

    <div class="card">
        <h2>📈 Volume</h2>
        <p id="volume">-</p>
    </div>

    <div class="card">
        <h2>⚡ Momentum Score</h2>
        <p id="momentum">-</p>
    </div>

    <div class="card">
        <h2>🤖 Prediction</h2>
        <p id="prediction">-</p>
    </div>

    <div class="card">
        <h2>🎯 Decision</h2>
        <p id="decision">-</p>
    </div>
</div>

<script>

const MARKET_ID = "btc-updown-5m-1776635400";

let prevPrice = null;
let prevVolume = null;

async function fetchData() {
    try {
        let res = await fetch(`https://gamma-api.polymarket.com/markets/${MARKET_ID}`);
        let data = await res.json();

        let price = parseFloat(data.lastTradePrice);
        let volume = parseFloat(data.volume);

        document.getElementById("price").innerText = price.toFixed(4);
        document.getElementById("volume").innerText = volume;

        if (prevPrice !== null) {

            let priceChange = price - prevPrice;
            let volumeChange = volume - prevVolume;

            let momentum = priceChange * volumeChange;

            document.getElementById("momentum").innerText = momentum.toFixed(6);

            let prediction = "";
            let decision = "";

            if (momentum > 0.0001) {
                prediction = "UP 📈";
                decision = "BUY YES";
                setColor("prediction", "green");
            } 
            else if (momentum < -0.0001) {
                prediction = "DOWN 📉";
                decision = "BUY NO";
                setColor("prediction", "red");
            } 
            else {
                prediction = "WEAK / NO EDGE";
                decision = "SKIP";
                setColor("prediction", "yellow");
            }

            document.getElementById("prediction").innerText = prediction;
            document.getElementById("decision").innerText = decision;
        }

        prevPrice = price;
        prevVolume = volume;

    } catch (err) {
        console.log("Error:", err);
    }
}

function setColor(id, cls) {
    document.getElementById(id).className = cls;
}

setInterval(fetchData, 5000);
fetchData();

</script>

</body>
</html>
